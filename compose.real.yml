name: nexusai-real-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: NexusAI_Real_Dev
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: ${NEXUS_DB_PASSWORD:?Configure the external env file}
      TZ: UTC
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai -d NexusAI_Real_Dev"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${NEXUS_HTTP_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=NexusAI_Real_Dev;Username=nexusai;Password=${NEXUS_DB_PASSWORD:?Configure the external env file}"
      JwtSettings__SecretKey: ${NEXUS_JWT_SECRET:?Configure the external env file}
      AiSettings__Provider: ${NEXUS_AI_PROVIDER:-Gemini}
      AiSettings__ApiUrl: ${NEXUS_AI_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
      AiSettings__ApiKey: ${NEXUS_AI_KEY:-TU_API_KEY_DE_GEMINI_O_OPENAI}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg-data:
