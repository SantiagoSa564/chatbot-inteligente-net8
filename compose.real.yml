name: nexusai-real-dev
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${NEXUS_SQL_PASSWORD:?Configure the external env file}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${NEXUS_HTTP_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=NexusAI_Real_Dev;User Id=sa;Password=${NEXUS_SQL_PASSWORD:?Configure the external env file};Encrypt=True;TrustServerCertificate=True"
      JwtSettings__SecretKey: ${NEXUS_JWT_SECRET:?Configure the external env file}
      AiSettings__Provider: ${NEXUS_AI_PROVIDER:-Gemini}
      AiSettings__ApiUrl: ${NEXUS_AI_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
      AiSettings__ApiKey: ${NEXUS_AI_KEY:-TU_API_KEY_DE_GEMINI_O_OPENAI}
    depends_on:
      sql:
        condition: service_healthy
volumes:
  sql-data:
